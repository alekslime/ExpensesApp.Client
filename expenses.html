<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expenses</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <style>
/* Small additions on top of Bootstrap (loaded from cdnjs in each page). */

body {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background-color: var(--bs-body-tertiary-bg, #f8f9fa);
}

main {
  flex: 1;
}

/* Live clock in the navbar */
.clock {
  font-variant-numeric: tabular-nums;
}

/* Stat cards */
.stat-label {
  display: block;
  font-size: 0.875rem;
  color: var(--bs-secondary-color);
}

.stat-value {
  display: block;
  font-size: 1.75rem;
  font-weight: 600;
}

.stat-value.stat-small {
  font-size: 1.1rem;
  font-weight: 500;
}

/* Toast message shown by JavaScript */
.toast-message {
  position: fixed;
  left: 50%;
  bottom: 1.5rem;
  transform: translateX(-50%) translateY(1rem);
  padding: 0.6rem 1.2rem;
  background: var(--bs-dark);
  color: #fff;
  border-radius: var(--bs-border-radius);
  box-shadow: var(--bs-box-shadow);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease, transform 0.2s ease;
  z-index: 1080;
}

.toast-message.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ---- layout ---- */
.container{width:100%;max-width:960px;margin:0 auto;padding:0 1rem}
.page{padding-top:1.5rem;padding-bottom:2rem}
.page.narrow{max-width:640px}
.page > * + *{margin-top:1.25rem}
.site-header{background:var(--bs-body-bg,#fff);border-bottom:1px solid var(--bs-border-color,#dee2e6)}
.header-row{display:flex;align-items:center;gap:1.25rem;flex-wrap:wrap;padding-top:.75rem;padding-bottom:.75rem}
.brand{font-weight:700;font-size:1.2rem;text-decoration:none;color:var(--bs-body-color)}
.nav{display:flex;gap:1rem;flex-wrap:wrap}
.nav a{text-decoration:none}
.nav a.active{font-weight:600;text-decoration:underline}
.clock{margin:0 0 0 auto;color:var(--bs-secondary-color)}
.card{padding:1.25rem;background:var(--bs-body-bg,#fff);border:1px solid var(--bs-border-color,#dee2e6);border-radius:var(--bs-border-radius,.375rem)}
.hero{padding:1rem 0}
.hero h1{font-size:2rem;font-weight:700}
.btn-inline{display:inline-block}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1rem}
.page-list{margin:0;padding-left:1.2rem}
.simple-list{padding-left:1.2rem;margin:0 0 .5rem}
.hint{color:var(--bs-secondary-color);margin:0}
/* ---- forms ---- */
.field{margin-bottom:1rem}
.field label{display:block;font-weight:500;margin-bottom:.25rem}
.field input,.field select,.toolbar-controls input,.toolbar-controls select,.convert-row select,.convert-row input{
  display:block;width:100%;padding:.4rem .75rem;font:inherit;color:var(--bs-body-color);
  background:var(--bs-body-bg,#fff);border:1px solid var(--bs-border-color,#ced4da);border-radius:var(--bs-border-radius,.375rem)}
.field input:focus,.field select:focus,.toolbar-controls input:focus,.toolbar-controls select:focus{outline:0;border-color:#86b7fe;box-shadow:0 0 0 .25rem rgba(13,110,253,.25)}
.error{display:block;color:#dc3545;min-height:1.1em;font-size:.85rem}
/* ---- expenses table ---- */
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.toolbar h2{margin:0;font-size:1.35rem}
.count{color:var(--bs-secondary-color);font-weight:400}
.toolbar-controls{display:flex;gap:.5rem;flex-wrap:wrap}
.toolbar-controls input{width:200px}.toolbar-controls select{width:170px}
.table-wrap{overflow-x:auto}
.expense-table{width:100%;border-collapse:collapse}
.expense-table th,.expense-table td{padding:.55rem .6rem;border-bottom:1px solid var(--bs-border-color,#dee2e6);text-align:left}
.expense-table .num{text-align:right;white-space:nowrap}
.expense-table .actions{text-align:right;white-space:nowrap}
.expense-table .actions .btn{margin-left:.25rem;padding:.2rem .6rem;font-size:.85rem;border:1px solid var(--bs-border-color,#ced4da)}
.expense-table .actions .btn-danger{border-color:#dc3545}
.empty{margin:1rem 0 0;color:var(--bs-secondary-color)}
.link-btn{background:none;border:0;padding:0;color:var(--bs-link-color,#0d6efd);text-decoration:underline;cursor:pointer;font:inherit}
.danger-zone{margin-top:1rem;text-align:right}
/* ---- modal + toast ---- */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);align-items:center;justify-content:center;padding:1rem;z-index:1070}
.modal-overlay.open{display:flex}
.edit-dialog{background:var(--bs-body-bg,#fff);border-radius:var(--bs-border-radius-lg,.5rem);padding:1.5rem;width:100%;max-width:440px;max-height:90vh;overflow:auto}
.edit-dialog h2{font-size:1.35rem;margin-bottom:1rem}
.modal-actions{display:flex;justify-content:flex-end;gap:.5rem}
.modal-actions .btn:not(.btn-primary){border:1px solid var(--bs-border-color,#ced4da)}
/* ---- currency ---- */
.convert-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin:1rem 0}
.convert-result{font-size:1.6rem;font-weight:600;margin:.5rem 0}
@media(max-width:560px){.clock{margin-left:0}.convert-row{grid-template-columns:1fr}.toolbar-controls input,.toolbar-controls select{width:100%}}
  </style>
</head>
<body>

  <header class="site-header">
    <nav class="navbar navbar-expand-md navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="index.html">Expense Tracker</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-nav" aria-controls="main-nav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="main-nav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="add.html">Add</a></li>
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="expenses.html">Expenses</a></li>
            <li class="nav-item"><a class="nav-link" href="currency.html">Currency</a></li>
          </ul>
          <span class="navbar-text clock" id="clock">--:--:--</span>
        </div>
      </div>
    </nav>
  </header>

  <main class="container py-4">

    <!-- Quick stats, updated by js/expenses.js -->
    <section class="row g-3 mb-4">
      <div class="col-sm-6 col-lg-3">
        <div class="card h-100 shadow-sm">
          <div class="card-body">
            <span class="stat-label">Total spent</span>
            <span class="stat-value" id="stat-total">0 Lek</span>
          </div>
        </div>
      </div>
      <div class="col-sm-6 col-lg-3">
        <div class="card h-100 shadow-sm">
          <div class="card-body">
            <span class="stat-label">Number of expenses</span>
            <span class="stat-value" id="stat-count">0</span>
          </div>
        </div>
      </div>
      <div class="col-sm-6 col-lg-3">
        <div class="card h-100 shadow-sm">
          <div class="card-body">
            <span class="stat-label">Average per expense</span>
            <span class="stat-value" id="stat-average">0 Lek</span>
          </div>
        </div>
      </div>
      <div class="col-sm-6 col-lg-3">
        <div class="card h-100 shadow-sm">
          <div class="card-body">
            <span class="stat-label">Biggest expense</span>
            <span class="stat-value stat-small" id="stat-biggest">none</span>
          </div>
        </div>
      </div>
    </section>

    <section class="card shadow-sm">
      <div class="card-body">
        <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3 mb-3">
          <h2 class="h4 mb-0">Expenses <span class="badge text-bg-secondary align-middle" id="count"></span></h2>
          <div class="d-flex flex-column flex-sm-row gap-2">
            <input type="search" class="form-control" id="search" placeholder="Search by title">
            <select class="form-select" id="filter-category">
              <option value="">All categories</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Books">Books</option>
              <option value="Rent">Rent</option>
              <option value="Fun">Fun</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th scope="col">Date</th>
                <th scope="col">Title</th>
                <th scope="col">Category</th>
                <th scope="col" class="text-end">Amount</th>
                <th scope="col" class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="expense-list">
              <!-- rows are rendered by js/expenses.js -->
            </tbody>
          </table>
        </div>

        <p class="text-secondary text-center py-4 mb-0" id="empty-message">
          No expenses yet. <a href="add.html">Add one</a> or
          <button type="button" class="btn btn-link p-0 align-baseline" id="load-sample">load sample data</button>.
        </p>

        <div class="border-top pt-3 mt-3 text-end">
          <button type="button" class="btn btn-outline-danger" id="clear-all">Delete all expenses</button>
        </div>
      </div>
    </section>

  </main>

  <!-- Edit modal: opened by JavaScript with bootstrap.Modal -->
  <div class="modal fade" id="edit-modal" tabindex="-1" aria-labelledby="edit-modal-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <form id="edit-form" novalidate>
          <div class="modal-header">
            <h2 class="modal-title h5" id="edit-modal-title">Edit expense</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="edit-id">

            <div class="mb-3">
              <label for="edit-title" class="form-label">Title</label>
              <input type="text" class="form-control" id="edit-title" name="title" required>
              <div class="invalid-feedback error" data-for="title"></div>
            </div>

            <div class="mb-3">
              <label for="edit-amount" class="form-label">Amount (Lek)</label>
              <input type="number" class="form-control" id="edit-amount" name="amount" min="1" step="1" required>
              <div class="invalid-feedback error" data-for="amount"></div>
            </div>

            <div class="mb-3">
              <label for="edit-category" class="form-label">Category</label>
              <select class="form-select" id="edit-category" name="category" required>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Books">Books</option>
                <option value="Rent">Rent</option>
                <option value="Fun">Fun</option>
                <option value="Other">Other</option>
              </select>
              <div class="invalid-feedback error" data-for="category"></div>
            </div>

            <div class="mb-0">
              <label for="edit-date" class="form-label">Date</label>
              <input type="date" class="form-control" id="edit-date" name="date" required>
              <div class="invalid-feedback error" data-for="date"></div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" id="cancel-edit" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="toast-message" id="toast"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script>
(() => {
  "use strict";

  const STORAGE_KEY = "expenses";
  const byId = (id) => document.getElementById(id);
  const expenseList = byId("expense-list");
  const editModal = byId("edit-modal");
  const editForm = byId("edit-form");
  if (!expenseList || !editModal || !editForm) return;

  const toast = byId("toast");
  const searchInput = byId("search");
  const categoryFilter = byId("filter-category");
  let toastTimer;

  function getExpenses() {
    try {
      const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      return Array.isArray(parsed) ? parsed : [];
    } catch {
      return [];
    }
  }

  function saveExpenses(expenses) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(expenses));
  }

  function showToast(message) {
    if (!toast) return;
    toast.textContent = message;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 2800);
  }

  function formatMoney(amount) {
    return `${Number(amount || 0).toLocaleString()} Lek`;
  }

  function formatDate(value) {
    if (!value) return "";
    const parts = value.split("-");
    return parts.length === 3 ? `${parts[2]}/${parts[1]}/${parts[0]}` : value;
  }

  function updateStats(expenses) {
    const total = expenses.reduce((sum, item) => sum + Number(item.amount || 0), 0);
    const count = expenses.length;
    const average = count ? Math.round(total / count) : 0;
    const biggest = expenses.reduce((best, item) => {
      return !best || Number(item.amount) > Number(best.amount) ? item : best;
    }, null);

    byId("stat-total").textContent = formatMoney(total);
    byId("stat-count").textContent = String(count);
    byId("stat-average").textContent = formatMoney(average);
    byId("stat-biggest").textContent = biggest
      ? `${biggest.title} (${formatMoney(biggest.amount)})`
      : "none";
  }

  function makeCell(value, className) {
    const cell = document.createElement("td");
    cell.textContent = value == null ? "" : String(value);
    if (className) cell.className = className;
    return cell;
  }

  function renderExpenses() {
    const allExpenses = getExpenses();
    const query = (searchInput?.value || "").trim().toLocaleLowerCase();
    const category = categoryFilter?.value || "";

    const filtered = allExpenses.filter((expense) => {
      const title = String(expense.title || "").toLocaleLowerCase();
      return title.includes(query) && (!category || expense.category === category);
    });

    expenseList.replaceChildren();

    filtered.forEach((expense) => {
      const row = document.createElement("tr");
      row.append(
        makeCell(formatDate(expense.date)),
        makeCell(expense.title),
        makeCell(expense.category),
        makeCell(formatMoney(expense.amount), "num")
      );

      const actions = document.createElement("td");
      actions.className = "actions";

      const editButton = document.createElement("button");
      editButton.type = "button";
      editButton.className = "btn";
      editButton.textContent = "Edit";
      editButton.setAttribute("aria-label", `Edit ${expense.title}`);
      editButton.addEventListener("click", () => openEdit(expense.id));

      const deleteButton = document.createElement("button");
      deleteButton.type = "button";
      deleteButton.className = "btn btn-danger";
      deleteButton.textContent = "Delete";
      deleteButton.setAttribute("aria-label", `Delete ${expense.title}`);
      deleteButton.addEventListener("click", () => {
        if (!window.confirm(`Delete "${expense.title}"?`)) return;
        saveExpenses(getExpenses().filter((item) => String(item.id) !== String(expense.id)));
        renderExpenses();
        showToast("Expense deleted.");
      });

      actions.append(editButton, deleteButton);
      row.append(actions);
      expenseList.append(row);
    });

    updateStats(allExpenses);

    const count = byId("count");
    if (count) count.textContent = `(${filtered.length})`;

    const emptyMessage = byId("empty-message");
    if (emptyMessage) {
      emptyMessage.style.display = filtered.length ? "none" : "block";
      const emptyText = emptyMessage.firstChild;
      if (emptyText && allExpenses.length && !filtered.length) {
        emptyText.textContent = "No matching expenses. Try another search or category. ";
      } else if (emptyText) {
        emptyText.textContent = "No expenses yet. ";
      }
    }
  }

  function clearEditErrors() {
    editForm.querySelectorAll(".error").forEach((node) => {
      node.textContent = "";
    });
  }

  function setEditError(field, message) {
    const target = editForm.querySelector(`.error[data-for="${field}"]`);
    if (target) target.textContent = message;
  }

  function openEdit(id) {
    const expense = getExpenses().find((item) => String(item.id) === String(id));
    if (!expense) {
      showToast("That expense could not be found.");
      return;
    }

    byId("edit-id").value = expense.id;
    byId("edit-title").value = expense.title || "";
    byId("edit-amount").value = expense.amount ?? "";
    byId("edit-category").value = expense.category || "";
    byId("edit-date").value = expense.date || "";

    clearEditErrors();
    editModal.classList.add("open");
    byId("edit-title").focus();
  }

  function closeEdit() {
    editModal.classList.remove("open");
    editForm.reset();
    clearEditErrors();
  }

  byId("cancel-edit")?.addEventListener("click", closeEdit);

  editModal.addEventListener("click", (event) => {
    if (event.target === editModal) closeEdit();
  });

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && editModal.classList.contains("open")) {
      closeEdit();
    }
  });

  editForm.addEventListener("submit", (event) => {
    event.preventDefault();

    const updated = {
      id: byId("edit-id").value,
      title: byId("edit-title").value.trim(),
      amount: Number(byId("edit-amount").value),
      category: byId("edit-category").value,
      date: byId("edit-date").value
    };

    clearEditErrors();
    let valid = true;

    if (!updated.title) {
      setEditError("title", "Please enter an expense title.");
      valid = false;
    } else if (updated.title.length > 80) {
      setEditError("title", "Title must be 80 characters or fewer.");
      valid = false;
    }

    if (!Number.isInteger(updated.amount) || updated.amount < 1) {
      setEditError("amount", "Enter a positive whole amount in Lek.");
      valid = false;
    }

    if (!["Food", "Transport", "Books", "Rent", "Fun", "Other"].includes(updated.category)) {
      setEditError("category", "Please choose a category.");
      valid = false;
    }

    if (!updated.date || !/^\d{4}-\d{2}-\d{2}$/.test(updated.date)) {
      setEditError("date", "Please choose a valid date.");
      valid = false;
    }

    if (!valid) return;

    const expenses = getExpenses();
    const index = expenses.findIndex((item) => String(item.id) === String(updated.id));
    if (index < 0) {
      showToast("That expense no longer exists.");
      closeEdit();
      renderExpenses();
      return;
    }

    expenses[index] = updated;
    saveExpenses(expenses);
    closeEdit();
    renderExpenses();
    showToast("Expense updated successfully.");
  });

  searchInput?.addEventListener("input", renderExpenses);
  categoryFilter?.addEventListener("change", renderExpenses);

  byId("clear-all")?.addEventListener("click", () => {
    const expenses = getExpenses();
    if (!expenses.length) return;

    if (window.confirm("Delete all expenses? This cannot be undone.")) {
      saveExpenses([]);
      renderExpenses();
      showToast("All expenses deleted.");
    }
  });

  byId("load-sample")?.addEventListener("click", () => {
    if (getExpenses().length) {
      showToast("Sample data can only be loaded when the list is empty.");
      return;
    }

    const samples = [
      { id: "sample-1", title: "Coffee", amount: 250, category: "Food", date: "2026-11-01" },
      { id: "sample-2", title: "Bus ticket", amount: 100, category: "Transport", date: "2026-11-02" },
      { id: "sample-3", title: "Programming book", amount: 1500, category: "Books", date: "2026-11-03" },
      { id: "sample-4", title: "Cinema", amount: 700, category: "Fun", date: "2026-11-04" }
    ];

    saveExpenses(samples);
    renderExpenses();
    showToast("Sample expenses loaded.");
  });

  const clock = byId("clock");
  function updateClock() {
    if (clock) clock.textContent = new Date().toLocaleTimeString();
  }
  updateClock();
  setInterval(updateClock, 1000);

  renderExpenses();
})();

  </script>
</body>
</html>
